<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Bright flat-color Boston Garden basketweave parquet tile (no gradients) -->
  <rect width="160" height="160" fill="#F5EEDC"/>
  <!-- Top-left: 4 vertical planks -->
  <rect x="0"  y="0" width="20" height="80" fill="#F6F0E2"/>
  <rect x="20" y="0" width="20" height="80" fill="#EFE4CC"/>
  <rect x="40" y="0" width="20" height="80" fill="#F4EAD5"/>
  <rect x="60" y="0" width="20" height="80" fill="#EBE0C7"/>
  <!-- Bottom-right: 4 vertical planks -->
  <rect x="80"  y="80" width="20" height="80" fill="#EFE4CC"/>
  <rect x="100" y="80" width="20" height="80" fill="#F6F0E2"/>
  <rect x="120" y="80" width="20" height="80" fill="#EBE0C7"/>
  <rect x="140" y="80" width="20" height="80" fill="#F4EAD5"/>
  <!-- Top-right: 4 horizontal planks -->
  <rect x="80" y="0"  width="80" height="20" fill="#EFE4CC"/>
  <rect x="80" y="20" width="80" height="20" fill="#F6F0E2"/>
  <rect x="80" y="40" width="80" height="20" fill="#EBE0C7"/>
  <rect x="80" y="60" width="80" height="20" fill="#F4EAD5"/>
  <!-- Bottom-left: 4 horizontal planks -->
  <rect x="0" y="80"  width="80" height="20" fill="#F4EAD5"/>
  <rect x="0" y="100" width="80" height="20" fill="#EBE0C7"/>
  <rect x="0" y="120" width="80" height="20" fill="#F6F0E2"/>
  <rect x="0" y="140" width="80" height="20" fill="#EFE4CC"/>
  <!-- Plank seams -->
  <g stroke="#DECBA4" stroke-width="1" fill="none">
    <path d="M0 0H160M0 80H160M0 0V160M80 0V160"/>
    <path d="M20 0V80M40 0V80M60 0V80M100 80V160M120 80V160M140 80V160"/>
    <path d="M80 20H160M80 40H160M80 60H160M0 100H80M0 120H80M0 140H80"/>
  </g>
  <!-- Subtle wood grain hairlines -->
  <g stroke="#E5D5B4" stroke-width="0.7" fill="none" opacity="0.75">
    <path d="M9 6V74M31 10V70M50 4V76M71 8V72"/>
    <path d="M89 88V154M111 84V156M130 90V150M149 86V154"/>
    <path d="M86 10H154M90 31H150M84 50H156M88 71H152"/>
    <path d="M6 89H74M10 111H70M4 130H76M8 149H72"/>
  </g>
</svg>
